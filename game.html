<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Race Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="questions.js"></script>
  <style>
    :root { --primary: #00a2ff; --yellow: #facc15; --green: #00b06f; --red: #ef4444; --surface: #111827; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: 'Kanit', sans-serif; }
    #three-container { position: absolute; inset: 0; z-index: 1; }
    
    #top-hud {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px);
      border: 2px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 8px 20px;
      display: flex; gap: 14px; color: #fff; z-index: 45; font-weight: 700; font-size: 0.9rem;
    }
    .hud-pill { background: linear-gradient(135deg, #f59e0b, #d97706); padding: 3px 10px; border-radius: 999px; }

    #checkpoint-modal, #knowledge-modal, #finish-screen {
      position: fixed; inset: 0; background: rgba(10, 12, 16, 0.9); backdrop-filter: blur(12px);
      display: none; justify-content: center; align-items: center; padding: 16px; z-index: 100; color: #fff;
    }
    .modal-box {
      background: #ffffff; border: 4px solid #38bdf8; border-radius: 24px; padding: 24px;
      max-width: 520px; width: 100%; color: #0f172a; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .btn-main {
      width: 100%; padding: 14px; border-radius: 16px; border: none; background: #10b981;
      color: #fff; font-size: 1.1rem; font-weight: 900; cursor: pointer; margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="three-container"></div>

  <div id="top-hud">
    <div>ผู้เล่น: <span id="hud-name" style="color:#38bdf8;">-</span></div>
    <div>สนาม: <span id="hud-unit" class="hud-pill">บทที่ 1</span></div>
    <div>คะแนน: <span id="hud-score">0</span></div>
  </div>

  <!-- Checkpoint Modal -->
  <div id="checkpoint-modal">
    <div class="modal-box">
      <h3 id="cp-title" style="color:#0284c7; margin-bottom:10px;">MISSION CHECKPOINT</h3>
      <div id="cp-q" style="font-size:1.1rem; font-weight:700; margin-bottom:16px;">คำถาม...</div>
      <div id="cp-answers" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- Finish Screen -->
  <div id="finish-screen">
    <div class="modal-box" style="background:#0f172a; color:#fff; border-color:#facc15;">
      <h2 style="color:#4ade80; font-size:2rem; margin-bottom:8px;">VICTORY LAP!</h2>
      <p>คุณพิชิตสนามแข่งประจำบทเรียนสำเร็จแล้ว</p>
      <div style="font-size:2.5rem; font-weight:900; color:#facc15; margin:15px 0;" id="final-score">0 / 0</div>
      <button class="btn-main" onclick="window.location.href='index.html'">กลับสู่ศูนย์รวมการเรียนรู้ (Main Hub)</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedUnit = parseInt(urlParams.get('unit')) || 1;
    const playerName = localStorage.getItem("word_road_player_name") || "นักเรียน";

    document.getElementById("hud-name").innerText = playerName;
    document.getElementById("hud-unit").innerText = `บทที่ ${selectedUnit}`;

    // ธีมสีสนามแข่งตามช่วงบทเรียน
    const themes = {
      city: { sky: 0x7dd3fc, ground: 0x4ade80 },    // บท 1-3: เมืองหลวง
      beach: { sky: 0xfde047, ground: 0xfef08a },   // บท 4-6: ชายหาด
      forest: { sky: 0x86efac, ground: 0x15803d },  // บท 7-9: ป่าเขา
      cyber: { sky: 0xa855f7, ground: 0x3b0764 }    // บท 10-12: ไซเบอร์
    };

    let currentTheme = themes.city;
    if (selectedUnit >= 10) currentTheme = themes.cyber;
    else if (selectedUnit >= 7) currentTheme = themes.forest;
    else if (selectedUnit >= 4) currentTheme = themes.beach;

    // ระบบ Three.js และการสร้างฉาก
    let scene, camera, renderer, car;
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(currentTheme.sky);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById("three-container").appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      // ลานถนน
      const roadGeo = new THREE.PlaneGeometry(24, 1000);
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      scene.add(road);

      // รถแข่ง
      const carGeo = new THREE.BoxGeometry(3, 1.2, 5);
      const carMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
      car = new THREE.Mesh(carGeo, carMat);
      car.position.y = 0.6;
      scene.add(car);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.onload = () => {
      init3D();
      // โหลดคำถามประจำบท
      const questions = unitsQuestionsData[selectedUnit] || [];
      if (questions.length > 0) {
        setTimeout(() => triggerQuestion(questions[0]), 1500);
      }
    };

    function triggerQuestion(qObj) {
      document.getElementById("cp-q").innerText = qObj.q;
      const ansDiv = document.getElementById("cp-answers");
      ansDiv.innerHTML = "";

      if (qObj.opts) {
        qObj.opts.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn-main";
          btn.style.background = "#e2e8f0";
          btn.style.color = "#0f172a";
          btn.innerText = opt;
          btn.onclick = () => {
            if (opt === qObj.target) {
              alert("ถูกต้องครับ! (+1 คะแนน)");
              document.getElementById("checkpoint-modal").style.display = "none";
              document.getElementById("finish-screen").style.display = "flex";
              document.getElementById("final-score").innerText = "1 / 1";
            } else {
              alert("ยังไม่ถูกต้อง ลองทบทวนใบความรู้นะครับ");
            }
          };
          ansDiv.appendChild(btn);
        });
      }
      document.getElementById("checkpoint-modal").style.display = "flex";
    }
  </script>
</body>
</html>
