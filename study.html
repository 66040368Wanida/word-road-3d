<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Word Kart: หนังสือเรียนดิจิทัล Microsoft Word (ม.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0284c7;--dark:#0369a1;--border:#38bdf8;--text:#0f172a;--sub:#334155;--gold:#facc15}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{min-height:100vh;font-family:'Kanit',sans-serif;color:var(--text);padding:28px 16px 40px;overflow-x:hidden;position:relative;
  background:linear-gradient(180deg,#bae6fd 0%,#e0f2fe 45%,#f0f9ff 100%);display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(to right,rgba(2,132,199,.1) 2px,transparent 2px),linear-gradient(to bottom,rgba(2,132,199,.1) 2px,transparent 2px);
  background-size:32px 32px;animation:drift 12s linear infinite;-webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 95%);mask-image:radial-gradient(ellipse at center,#000 40%,transparent 95%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 10% 15%,rgba(250,204,21,.26),transparent 28%),radial-gradient(circle at 90% 85%,rgba(37,99,235,.2),transparent 32%),radial-gradient(circle at 88% 10%,rgba(16,185,129,.16),transparent 25%)}
@keyframes drift{to{background-position:32px 32px}}
.ico{width:22px;height:22px;fill:currentColor;display:inline-block;vertical-align:middle;flex-shrink:0}
.read-bar{position:fixed;top:0;left:0;height:6px;width:0;z-index:500;background:linear-gradient(90deg,#facc15,#10b981,#0284c7);border-radius:0 6px 6px 0}

.study-container{position:relative;z-index:1;width:100%;max-width:880px;margin:auto;background:linear-gradient(180deg,#fff,#f8fcff);
  border:4px solid var(--blue);border-radius:32px;padding:40px 30px 30px;box-shadow:0 12px 0 var(--dark),0 28px 50px rgba(2,132,199,.28);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.study-container::before{content:'';position:absolute;left:30px;right:30px;top:-4px;height:10px;border-radius:0 0 8px 8px;background:repeating-conic-gradient(#0f172a 0 25%,#fff 0 50%) 0 0/10px 10px}
@keyframes pop{from{transform:scale(.95) translateY(15px);opacity:0}to{transform:none;opacity:1}}

.top-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.unit-pill{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;font:italic 800 1rem 'Chakra Petch',sans-serif;
  padding:8px 22px;border-radius:999px;box-shadow:0 4px 0 var(--dark),inset 0 2px 0 rgba(255,255,255,.3)}
.btn-back{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:2px solid var(--border);background:linear-gradient(180deg,#fff,#e0f2fe);
  color:var(--blue);font-weight:800;font-size:.9rem;text-decoration:none;box-shadow:0 4px 0 var(--blue);transition:transform .15s}
.btn-back:hover{transform:translateY(-2px)}.btn-back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue)}

.track{display:flex;gap:6px;align-items:center;margin-bottom:24px;padding:10px 12px;background:#f0f9ff;border:2px solid #bae6fd;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.dot{flex:1 0 26px;min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 .74rem 'Chakra Petch',sans-serif;text-decoration:none;color:#64748b;background:#fff;border:2px solid #cbd5e1;transition:transform .15s}
.dot:hover{transform:translateY(-2px)}
.dot.done{background:#10b981;border-color:#047857;color:#fff}
.dot.now{background:var(--gold);border-color:#d97706;color:#713f12;transform:scale(1.2);box-shadow:0 3px 0 #d97706}
.dot.lock{opacity:.5;pointer-events:none;background:#e2e8f0}
.dot .ico{width:13px;height:13px}

.lesson-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:1.65rem;font-weight:900;color:var(--blue);line-height:1.35;padding-bottom:16px;margin-bottom:22px;border-bottom:3px dashed #bae6fd}
.chip{font:italic 900 1rem 'Chakra Petch',sans-serif;color:#fff;background:linear-gradient(135deg,#0ea5e9,#2563eb);padding:6px 16px;border-radius:14px;box-shadow:0 4px 0 var(--dark);white-space:nowrap}

.intro{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,#f0f9ff,#e0f2fe);border-left:6px solid var(--gold);border-radius:0 20px 20px 0;padding:16px 20px;font-size:1.05rem;line-height:1.8;color:var(--text);margin-bottom:26px}
.intro .ico{width:34px;height:34px;padding:7px;border-radius:12px;background:var(--gold);color:#713f12;box-shadow:0 3px 0 #d97706;margin-top:2px}

.ribbon{display:inline-flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800;color:#fff;background:linear-gradient(90deg,#0284c7,#38bdf8);padding:8px 20px;border-radius:16px;box-shadow:0 4px 0 var(--dark);margin-bottom:16px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:26px}
.card{position:relative;background:linear-gradient(180deg,#fff,#f1f5f9);border:3px solid #e2e8f0;border-radius:20px;padding:16px 16px 16px 58px;line-height:1.6;color:var(--sub);box-shadow:0 4px 0 #cbd5e1;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--border)}
.card::before{content:'';position:absolute;left:16px;top:18px;width:26px;height:26px;border-radius:8px;border:3px solid var(--blue);background:repeating-conic-gradient(#0284c7 0 25%,#fff 0 50%) 0 0/9px 9px}
.card b{display:block;font-size:1.05rem;color:var(--text);margin-bottom:2px}

.tip{background:linear-gradient(180deg,#fffbeb,#fef9c3);border:3px solid var(--gold);border-radius:22px;padding:20px 22px;box-shadow:0 6px 0 #eab308;line-height:1.95;color:#422006}
.tip-title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;color:#92400e;margin-bottom:8px}
.tip-title .ico{width:34px;height:34px;padding:7px;border-radius:12px;background:var(--gold);color:#713f12;box-shadow:0 3px 0 #d97706}
.key{display:inline-block;margin:2px 3px;padding:2px 10px;border-radius:9px;background:linear-gradient(180deg,#fff,#e2e8f0);color:var(--text);border:2px solid #94a3b8;box-shadow:0 3px 0 #64748b;font:800 .9rem 'Chakra Petch',sans-serif}

.pager{display:flex;gap:12px;margin-top:30px}
.pager a{flex:1;text-decoration:none;padding:12px 16px;border-radius:16px;background:#f0f9ff;border:2px solid var(--border);color:var(--dark);font-weight:800;font-size:.95rem;box-shadow:0 4px 0 var(--blue);transition:transform .15s;display:flex;align-items:center;gap:10px}
.pager a.next{justify-content:flex-end;text-align:right}
.pager a:hover{transform:translateY(-2px)}.pager a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue)}
.pager a.off{opacity:.4;pointer-events:none;filter:grayscale(1)}
.pager small{display:block;font-weight:600;color:#64748b;font-size:.75rem}

.footer{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;margin-top:22px;padding-top:22px;border-top:3px dashed #bae6fd}
.btn{padding:16px;border-radius:18px;border:none;font:italic 800 1.1rem 'Chakra Petch',sans-serif;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;transition:all .15s}
.btn-home{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1;box-shadow:0 5px 0 #94a3b8}
.btn-home:active{transform:translateY(3px);box-shadow:0 1px 0 #94a3b8}
.btn-game{color:#fff;background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 6px 0 #047857,0 10px 20px rgba(16,185,129,.25);position:relative;overflow:hidden}
.btn-game::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{60%,100%{left:130%}}
.btn-game:hover{filter:brightness(1.06)}.btn-game:active{transform:translateY(3px);box-shadow:0 2px 0 #047857}
a:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

@media (max-width:640px){body{padding:16px 10px 32px}.study-container{padding:32px 16px 22px;border-radius:24px}.lesson-title{font-size:1.35rem}.footer{grid-template-columns:1fr}.pager{flex-direction:column}.pager a.next{justify-content:flex-start;text-align:left}.intro{font-size:.98rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const TOTAL = 12;
const uid = Math.min(TOTAL, Math.max(1, parseInt(new URLSearchParams(location.search).get('unit')) || 1));

let reached = TOTAL;
try {
  const u = localStorage.getItem("word_kart_active_user"), db = JSON.parse(localStorage.getItem("word_kart_db") || "{}");
  if (u && db[u]) reached = db[u].stage || 1;
} catch (e) {}
reached = Math.max(reached, uid);

document.getElementById("unit-tag").innerHTML = svg("book") + `<span>UNIT ${uid}</span>`;
document.getElementById("btn-game").href = `game.html?stage=${uid}`;

document.getElementById("track").innerHTML = Array.from({length: TOTAL}, (_, i) => {
  const n = i + 1, cls = n === uid ? "now" : n < uid ? "done" : n > reached ? "lock" : "";
  const inner = n === uid ? n : n < uid ? svg("check") : n > reached ? svg("lock") : n;
  return `<a class="dot ${cls}" href="study.html?unit=${n}" title="บทที่ ${n}">${inner}</a>`;
}).join("");

const L = lessons[uid];
document.getElementById("title").innerHTML = `<span class="chip">บทที่ ${uid}</span><span>${L.t}</span>`;
document.getElementById("body").innerHTML = `
  <div class="intro">${svg(L.ic)}<div>${L.intro}</div></div>
  <div class="ribbon">${svg("check")}<span>${L.h}</span></div>
  <div class="cards">${L.pts.map(p => `<div class="card"><b>${p[0]}</b>${K(p[1])}</div>`).join("")}</div>
  <div class="tip"><div class="tip-title">${svg(L.tip[0])}<span>${L.tip[1]}</span></div>${K(L.tip[2])}</div>`;

document.getElementById("pager").innerHTML = `
  <a class="${uid <= 1 ? 'off' : ''}" href="study.html?unit=${uid - 1}">${svg("left")}<div><small>บทก่อนหน้า</small>บทที่ ${uid - 1}</div></a>
  <a class="next ${uid >= TOTAL || uid + 1 > reached ? 'off' : ''}" href="study.html?unit=${uid + 1}"><div><small>บทถัดไป</small>บทที่ ${uid + 1}</div>${svg("right")}</a>`;

addEventListener("scroll", () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  document.getElementById("read-bar").style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + "%";
}, { passive: true });
</script>
