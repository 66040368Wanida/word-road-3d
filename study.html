<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: เอกสารสรุปบทเรียนประจำวิชา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sky: #0284c7;
      --bg-gradient: radial-gradient(circle at 50% 20%, #38bdf8 0%, #0369a1 100%);
      --card-bg: #ffffff;
      --border-blue: #38bdf8;
      --primary-blue: #0284c7;
      --dark-blue: #0369a1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --yellow: #facc15;
      --yellow-light: #fefce8;
      --green: #10b981;
      --green-dark: #047857;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Kanit', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .ico {
      width: 20px; height: 20px; fill: currentColor;
      display: inline-block; vertical-align: middle; flex-shrink: 0;
    }

    .study-container {
      background: var(--card-bg);
      border: 5px solid var(--border-blue);
      border-radius: 32px;
      padding: 32px 28px;
      max-width: 820px; width: 100%;
      box-shadow: 0 25px 60px rgba(2, 132, 199, 0.4), 0 0 0 8px rgba(255, 255, 255, 0.25);
      text-align: left;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #bae6fd;
      padding-bottom: 16px;
      margin-bottom: 24px;
      gap: 12px; flex-wrap: wrap;
    }

    .unit-badge-pill {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
      display: inline-flex; align-items: center; gap: 6px;
    }

    .btn-back-hub {
      padding: 10px 18px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn-back-hub:hover { background: #e2e8f0; color: #0f172a; }

    /* Content Typography & Layout */
    .lesson-header-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary-blue);
      line-height: 1.35;
      margin-bottom: 20px;
      display: flex; align-items: flex-start; gap: 10px;
    }

    .content-section {
      font-size: 1rem;
      line-height: 1.75;
      color: #334155;
    }

    .content-section h4 {
      color: var(--dark-blue);
      font-size: 1.15rem;
      font-weight: 800;
      margin: 22px 0 10px;
      display: flex; align-items: center; gap: 8px;
      border-left: 4px solid var(--primary-blue);
      padding-left: 10px;
    }

    .content-section p { margin-bottom: 10px; }

    .content-section ul {
      margin-left: 20px;
      margin-bottom: 14px;
    }

    .content-section li {
      margin-bottom: 6px;
    }

    /* Concept & Key Shortcut Boxes */
    .key-callout-box {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
      border-radius: 18px;
      padding: 18px;
      margin: 18px 0;
      box-shadow: inset 0 2px 4px rgba(2, 132, 199, 0.05);
    }

    .key-callout-title {
      font-weight: 800;
      color: #0369a1;
      font-size: 0.98rem;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }

    .shortcut-badge {
      background: #fef08a;
      color: #713f12;
      border: 1.5px solid #facc15;
      padding: 2px 8px;
      border-radius: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 2px 0 #eab308;
      display: inline-block;
      margin: 2px 4px;
    }

    .ui-demo-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }

    .ui-demo-caption {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 8px;
    }

    /* Start Race Button */
    .btn-play-now {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16, 185, 129, 0.35);
      text-align: center;
      display: flex; justify-content: center; align-items: center; gap: 10px;
      text-decoration: none;
      margin-top: 32px;
      transition: all 0.15s;
    }

    .btn-play-now:hover { filter: brightness(1.08); }
    .btn-play-now:active { transform: translateY(4px); box-shadow: 0 2px 0 #047857; }
  </style>
</head>
<body>

  <div class="study-container">
    <!-- Top Navigation -->
    <div class="top-nav">
      <div class="unit-badge-pill" id="study-unit-tag">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 13.09L4.27 12 12 7.78 19.73 12 12 16.09z"/></svg>

      <a href="index.html" class="btn-back-hub">

        <span>กลับหน้ารวมบทเรียน</span>
      </a>
    </div>

    <!-- Main Content Area -->
    <div class="content-section">
      <h2 class="lesson-header-title" id="study-title">กำลังโหลดข้อมูลบทเรียน...</h2>
      <div id="study-body"></div>
    </div>

    <!-- Action Button -->
    <a id="btn-start-game" class="btn-play-now" href="#">
      <svg class="ico" style="width:24px; height:24px;" viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
      <span>พร้อมแล้ว! เข้าสู่สนามแข่งทบทวนบทนี้</span>
    </a>
  </div>

    const studyDatabase = {

            <li><b>Quick Access Toolbar (แถบเครื่องมือด่วน):</b> อยู่มุมบนซ้าย รวบรวมปุ่มที่ใช้บ่อย เช่น ปุ่มบันทึก (Save), ปุ่มย้อนกลับ (Undo) และปุ่มทำซ้ำ (Redo)</li>
            <li><b>Ribbon (แถบคำสั่ง):</b> แถบเมนูใหญ่ที่รวบรวมคำสั่งทั้งหมดแบ่งออกเป็นหมวดหมู่ (Tabs) เช่น หน้าแรก (Home), แทรก (Insert), เค้าโครง (Layout)</li>

          </div>
        `

              <svg class="ico" viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-3 0h2v2H5v-2zm0-3h2v2H5V8zm7 9H8v-2h4v2zm3-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
