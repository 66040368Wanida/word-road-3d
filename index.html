<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Portal & Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #38bdf8 0%, #0369a1 100%);
      --card-bg: #ffffff;
      --border-blue: #38bdf8;
      --primary-blue: #0284c7;
      --text-main: #0f172a;
      --yellow: #facc15;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Kanit', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .ico { width: 20px; height: 20px; fill: currentColor; display: inline-block; vertical-align: middle; }

    /* Login Screen Modal (หน้าแรกสุด) */
    #login-screen {
      position: fixed; inset: 0;
      background: var(--bg-gradient);
      display: flex; justify-content: center; align-items: center;
      padding: 16px; z-index: 200;
    }

    .login-card {
      background: var(--card-bg);
      border: 5px solid var(--border-blue);
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 530px; width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(2, 132, 199, 0.4), 0 0 0 8px rgba(255, 255, 255, 0.3);
      position: relative;
    }

    .login-header {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      margin: -28px -24px 20px -24px;
      padding: 24px 16px 18px;
      border-radius: 26px 26px 0 0;
      border-bottom: 4px solid var(--yellow);
    }

    .game-logo {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.4rem; font-weight: 800; color: #ffffff;
      text-shadow: 3px 3px 0px #0369a1, 0 0 18px rgba(250, 204, 21, 0.6);
      line-height: 1.1;
    }

    .game-sub-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
      background: var(--yellow); color: #713f12; font-size: 0.85rem; font-weight: 800;
      padding: 4px 14px; border-radius: 999px; box-shadow: 0 3px 0 #ca8a04;
    }

    .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; text-align: left; }
    .rule-card { background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 14px; padding: 10px 12px; font-size: 0.82rem; color: #475569; }
    .rule-card.points { background: #fefce8; border-color: #fde047; }
    .rule-header { font-size: 0.88rem; font-weight: 800; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }

    .player-input {
      width: 100%; padding: 14px 18px; border-radius: 16px;
      border: 3px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      font-size: 1.05rem; font-weight: 700; text-align: center; outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); margin-bottom: 14px;
    }
    .player-input:focus { border-color: #0284c7; background: #fff; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25); }

    /* Action Buttons Pair */
    .btn-login-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-portal {
      padding: 14px; border-radius: 18px; border: none; font-family: 'Kanit', sans-serif;
      font-size: 1rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s;
    }

    .btn-study-portal {
      background: #e0f2fe; color: #0284c7; border: 2px solid #38bdf8;
      box-shadow: 0 4px 0 #0284c7;
    }
    .btn-study-portal:active { transform: translateY(2px); box-shadow: 0 2px 0 #0284c7; }

    .btn-game-portal {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%); color: #ffffff;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-game-portal:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }

    /* Main Hub Screen (หน้าสรุปบทเรียน) */
    #hub-screen { display: none; width: 100%; max-width: 840px; flex-direction: column; align-items: center; }

    .hero-card {
      background: var(--card-bg); border: 5px solid var(--border-blue); border-radius: 32px;
      padding: 24px; width: 100%; box-shadow: 0 25px 60px rgba(2, 132, 199, 0.4); text-align: center; margin-bottom: 24px;
    }

    .units-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 18px; }

    .unit-card {
      background: #ffffff; border: 3px solid #e2e8f0; border-radius: 22px; padding: 18px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); transition: all 0.2s; text-align: left;
    }
    .unit-card:hover { transform: translateY(-4px); border-color: #38bdf8; }

    .unit-tag { background: #0284c7; color: #fff; font-family: 'Chakra Petch'; font-weight: 800; font-size: 0.82rem; padding: 3px 10px; border-radius: 8px; }
    .unit-title-text { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin: 10px 0 14px; line-height: 1.4; }

    .btn-read-unit {
      width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #bae6fd;
      background: #f0f9ff; color: #0284c7; font-weight: 800; font-size: 0.92rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* Modal อ่านสรุป */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; padding: 18px; z-index: 300;
    }
    .study-modal-box {
      background: #ffffff; border: 4px solid #38bdf8; border-radius: 28px; padding: 24px;
      max-width: 650px; width: 100%; color: #0f172a; max-height: 88vh; overflow-y: auto; text-align: left;
    }
    .btn-close-modal {
      width: 100%; margin-top: 18px; padding: 12px; border-radius: 14px; border: none;
      background: #ef4444; color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #b91c1c;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN & PORTAL SCREEN (หน้าเลือกล็อกอินแรกสุด) -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="game-logo">WORD ROAD 3D</div>
        <div class="game-sub-badge">
          <svg class="ico" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
          <span>ภารกิจซิ่งพิชิต Microsoft Word ม.1</span>
        </div>
      </div>

      <div class="rule-grid">
        <div class="rule-card">
          <div class="rule-header" style="color:#0284c7;">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5z"/></svg>
            <span>โหมดอ่านสรุป</span>
          </div>
          <p>• อ่านสรุปเนื้อหาสำคัญ 12 บท<br>• มีแผนภาพประกอบเข้าใจง่าย</p>
        </div>
        <div class="rule-card points">
          <div class="rule-header" style="color:#ca8a04;">
            <svg class="ico" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2z"/></svg>
            <span>โหมดสนามแข่ง 3D</span>
          </div>
          <p>• ลุยสนามแข่งรถ 20 ข้อ 12 ด่าน<br>• ตอบคำถามทบทวนความรู้</p>
        </div>
      </div>

      <input type="text" id="player-input" class="player-input" placeholder="พิมพ์ชื่อ - นามสกุล หรือ เลขที่..." autocomplete="off" />

      <div class="btn-login-pair">
        <button class="btn-portal btn-study-portal" onclick="goToStudyHub()">
          <svg class="ico" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          <span>อ่านสรุปเนื้อหา</span>
        </button>

        <button class="btn-portal btn-game-portal" onclick="goToGame3D()">
          <svg class="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>เข้าสนามแข่ง 3D</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. MAIN HUB SCREEN (หน้าสรุปเนื้อหา 12 บทเรียน) -->
  <div id="hub-screen">
    <div class="hero-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="text-align:left;">
          <h2 style="color:#0284c7; font-size:1.5rem;">ศูนย์รวมสรุปบทเรียน (12 บท)</h2>
          <p style="color:#64748b; font-size:0.9rem;">ผู้เรียน: <b id="display-user-name" style="color:#0f172a;">-</b></p>
        </div>
        <button onclick="backToLogin()" style="padding:8px 16px; border-radius:12px; border:2px solid #cbd5e1; background:#f8fafc; font-weight:800; cursor:pointer;">
          เปลี่ยนชื่อ / สลับโหมด
        </button>
      </div>
    </div>

    <div class="units-grid" id="units-grid"></div>
  </div>

  <!-- Modal อ่านสรุปเนื้อหา -->
  <div class="modal-backdrop" id="study-modal">
    <div class="study-modal-box">
      <h3 id="modal-title" style="color:#0284c7; font-size:1.3rem; margin-bottom:12px; border-bottom:2px solid #bae6fd; padding-bottom:8px;">สรุปเนื้อหา</h3>
      <div id="modal-body" style="font-size:0.95rem; line-height:1.6; color:#334155;"></div>
      <button class="btn-close-modal" onclick="closeStudyModal()">ปิดหน้าต่างสรุป</button>
    </div>
  </div>

  <script>
    const fullUnitsData = [
      { id: 1, title: "บทที่ 1: รู้จักหน้าตาและส่วนประกอบของ Microsoft Word", summary: "ส่วนประกอบสำคัญ ได้แก่ Quick Access Toolbar, Title Bar, แถบเมนู Ribbon, ไม้บรรทัด และ Status Bar" },
      { id: 2, title: "บทที่ 2: การจัดการไฟล์เอกสารและคีย์ลัดพื้นฐาน", summary: "คีย์ลัดสำคัญ: Ctrl+N (สร้างใหม่), Ctrl+S (บันทึก), Ctrl+O (เปิดไฟล์) และ Ctrl+Z (ยกเลิก)" },
      { id: 3, title: "บทที่ 3: การพิมพ์และการจัดการข้อความภาษาไทย/อังกฤษ", summary: "คำสั่งกลุ่มคลิปบอร์ด: Ctrl+C (คัดลอก), Ctrl+X (ตัด) และ Ctrl+V (วาง)" },
      { id: 4, title: "บทที่ 4: การตกแต่งฟอนต์และรูปแบบตัวอักษร", summary: "Ctrl+B (ตัวหนา), Ctrl+I (ตัวเอียง), Ctrl+U (ขีดเส้นใต้) และเครื่องมือ Format Painter (แปรงทาสี)" },
      { id: 5, title: "บทที่ 5: การจัดแนวย่อหน้าและการเว้นระยะบรรทัด", summary: "การจัดชิดซ้าย (Ctrl+L), กึ่งกลาง (Ctrl+E), ชิดขวา (Ctrl+R) และกระจายแบบ Thai Distributed" },
      { id: 6, title: "บทที่ 6: การสร้างรายการหัวข้อย่อยและลำดับเลข", summary: "Bullets (สัญลักษณ์หัวข้อย่อยไม่มีลำดับ) และ Numbering (ลำดับเลข 1, 2, 3)" },
      { id: 7, title: "บทที่ 7: การแทรกรูปภาพและการจัดตัดข้อความ (Wrap Text)", summary: "โหมด Wrap Text: Square (ล้อมรอบสี่เหลี่ยม) และ Behind Text (รูปภาพเป็นฉากหลัง)" },
      { id: 8, title: "บทที่ 8: การสร้างและตกแต่งตารางข้อมูล", summary: "โครงสร้างตาราง: Column (คอลัมน์แนวตั้ง) และ Row (แถวแนวนอน) การผสานเซลล์ (Merge Cells)" },
      { id: 9, title: "บทที่ 9: การตั้งค่าหน้ากระดาษและระยะขอบ (Page Setup)", summary: "Portrait (วางกระดาษแนวตั้ง) / Landscape (แนวนอน) และการตั้งระยะขอบกระดาษ (Margins)" },
      { id: 10, title: "บทที่ 10: การตรวจคำผิดและการค้นหา/แทนที่คำ", summary: "สัญลักษณ์เตือน: เส้นหยักสีแดง (สะกดผิด) และเส้นหยักสีฟ้า (เว้นวรรค/ไวยากรณ์ผิด)" },
      { id: 11, title: "บทที่ 11: การใช้งาน Style และการสร้างสารบัญอัตโนมัติ", summary: "กำหนด Heading 1 และ Heading 2 เพื่อดึงสารบัญอัตโนมัติ (Table of Contents)" },
      { id: 12, title: "บทที่ 12: การส่งออกไฟล์และการพิมพ์เอกสาร (Print & Export)", summary: "การบันทึกไฟล์เป็น .PDF เพื่อล็อกการจัดหน้ากระดาษไม่ให้เคลื่อนเมื่อนำไปพิมพ์" }
    ];

    const inputName = document.getElementById("player-input");

    // ดึงชื่อเดิม
    const savedName = localStorage.getItem("word_road_player_name");
    if (savedName) inputName.value = savedName;

    function validateName() {
      const name = inputName.value.trim();
      if (!name) {
        alert("กรุณาพิมพ์ชื่อ - นามสกุล หรือ เลขที่ก่อนนะครับ!");
        inputName.focus();
        return null;
      }
      localStorage.setItem("word_road_player_name", name);
      return name;
    }

    // กดเลือกไปอ่านสรุปบทเรียน
    function goToStudyHub() {
      const name = validateName();
      if (!name) return;

      document.getElementById("display-user-name").innerText = name;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("hub-screen").style.display = "flex";
      renderHubUnits();
    }

    // กดเลือกไปเล่นเกมแข่งรถ 3D
    function goToGame3D() {
      const name = validateName();
      if (!name) return;

      // ลุยสนามแข่ง
      window.location.href = `game.html?unit=1`;
    }

    function backToLogin() {
      document.getElementById("hub-screen").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }

    function renderHubUnits() {
      const container = document.getElementById("units-grid");
      container.innerHTML = "";
      fullUnitsData.forEach(u => {
        const card = document.createElement("div");
        card.className = "unit-card";
        card.innerHTML = `
          <div>
            <span class="unit-tag">UNIT ${u.id}</span>
            <div class="unit-title-text">${u.title}</div>
          </div>
          <button class="btn-read-unit" onclick="openStudyModal(${u.id})">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <span>อ่านสรุปบทเรียน</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function openStudyModal(unitId) {
      const u = fullUnitsData.find(item => item.id === unitId);
      if (u) {
        document.getElementById("modal-title").innerText = u.title;
        document.getElementById("modal-body").innerHTML = `<p><b>📌 สรุปประเด็นสำคัญ:</b></p><p style="margin-top:6px;">${u.summary}</p>`;
        document.getElementById("study-modal").style.display = "flex";
      }
    }

    function closeStudyModal() {
      document.getElementById("study-modal").style.display = "none";
    }
  </script>
</body>
</html>
