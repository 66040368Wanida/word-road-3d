<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Ultimate Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #38bdf8 0%, #0369a1 100%);
      --card-bg: #ffffff;
      --border-blue: #38bdf8;
      --yellow: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      font-family: 'Kanit', sans-serif;
      color: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
    }

    .ico { width: 20px; height: 20px; fill: currentColor; display: inline-block; vertical-align: middle; }

    /* Login Screen */
    #login-screen {
      position: fixed; inset: 0; background: var(--bg-gradient);
      display: flex; justify-content: center; align-items: center;
      padding: 16px; z-index: 200;
    }

    .login-card {
      background: var(--card-bg); border: 5px solid var(--border-blue);
      border-radius: 32px; padding: 28px 24px; max-width: 520px; width: 100%;
      text-align: center; box-shadow: 0 25px 60px rgba(2, 132, 199, 0.4);
    }

    .login-header {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      margin: -28px -24px 20px -24px; padding: 24px 16px 18px;
      border-radius: 26px 26px 0 0; border-bottom: 4px solid var(--yellow);
    }

    .game-logo {
      font-family: 'Chakra Petch', sans-serif; font-size: 2.4rem; font-weight: 800; color: #ffffff;
      text-shadow: 3px 3px 0px #0369a1, 0 0 18px rgba(250, 204, 21, 0.6); line-height: 1.1;
    }

    .player-input {
      width: 100%; padding: 14px 18px; border-radius: 16px;
      border: 3px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      font-size: 1.05rem; font-weight: 700; text-align: center; outline: none; margin-bottom: 16px;
    }

    .btn-login-start {
      width: 100%; padding: 15px; border-radius: 18px; border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff; font-size: 1.2rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 6px 0 #047857; display: flex; justify-content: center; align-items: center; gap: 8px;
    }

    /* Hub Screen */
    #hub-screen { display: none; width: 100%; max-width: 860px; flex-direction: column; align-items: center; }

    .hub-header-card {
      background: var(--card-bg); border: 5px solid var(--border-blue); border-radius: 28px;
      padding: 20px 24px; width: 100%; box-shadow: 0 20px 50px rgba(2, 132, 199, 0.35);
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;
    }

    .units-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }

    .unit-card {
      background: #ffffff; border: 3px solid #e2e8f0; border-radius: 22px; padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08); text-align: left;
    }
    .unit-card:hover { transform: translateY(-4px); border-color: #38bdf8; }

    .unit-tag { background: #0284c7; color: #fff; font-family: 'Chakra Petch'; font-weight: 800; font-size: 0.82rem; padding: 3px 10px; border-radius: 8px; }
    .unit-title-text { font-size: 1.08rem; font-weight: 800; color: #0f172a; margin: 12px 0 16px; line-height: 1.45; }

    .btn-group { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; }

    .btn-act {
      padding: 11px; border-radius: 14px; border: none; font-family: 'Kanit', sans-serif;
      font-size: 0.92rem; font-weight: 800; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 6px; transition: all 0.15s;
    }

    .btn-read { background: #f0f9ff; color: #0284c7; border: 2px solid #bae6fd; }
    .btn-play { background: linear-gradient(180deg, #10b981 0%, #059669 100%); color: #ffffff; box-shadow: 0 4px 0 #047857; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="game-logo">WORD ROAD 3D</div>
        <div style="color:#facc15; font-weight:800; font-size:0.9rem; margin-top:6px;">ศูนย์รวมการเรียนรู้ Microsoft Word ม.1</div>
      </div>

      <input type="text" id="player-input" class="player-input" placeholder="พิมพ์ชื่อ - นามสกุล หรือ เลขที่..." autocomplete="off" />

      <button class="btn-login-start" onclick="handleLogin()">
        <svg class="ico" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        <span>เข้าสู่ระบบ (LOGIN)</span>
      </button>
    </div>
  </div>

  <!-- 2. MAIN HUB SCREEN -->
  <div id="hub-screen">
    <div class="hub-header-card">
      <div>
        <span style="color:#0284c7; font-weight:800;">ยินดีต้อนรับ:</span>
        <span id="display-user-name" style="color:#0f172a; font-weight:900; font-size:1.15rem; margin-left:6px;">-</span>
      </div>
      <button onclick="switchUser()" style="padding:8px 14px; border-radius:12px; border:2px solid #cbd5e1; background:#f8fafc; font-weight:800; cursor:pointer;">สลับชื่อ</button>
    </div>

    <div class="units-grid" id="units-grid"></div>
  </div>

  <script>
    const unitsList = [
      { id: 1, title: "บทที่ 1: รู้จักหน้าตาและส่วนประกอบของ Microsoft Word" },
      { id: 2, title: "บทที่ 2: การจัดการไฟล์เอกสารและคีย์ลัดพื้นฐาน" },
      { id: 3, title: "บทที่ 3: การพิมพ์และการจัดการข้อความภาษาไทย/อังกฤษ" },
      { id: 4, title: "บทที่ 4: การตกแต่งฟอนต์และรูปแบบตัวอักษร" },
      { id: 5, title: "บทที่ 5: การจัดแนวย่อหน้าและการเว้นระยะบรรทัด" },
      { id: 6, title: "บทที่ 6: การสร้างรายการหัวข้อย่อยและลำดับเลข" },
      { id: 7, title: "บทที่ 7: การแทรกรูปภาพและการจัดตัดข้อความ (Wrap Text)" },
      { id: 8, title: "บทที่ 8: การสร้างและตกแต่งตารางข้อมูล" },
      { id: 9, title: "บทที่ 9: การตั้งค่าหน้ากระดาษและระยะขอบ (Page Setup)" },
      { id: 10, title: "บทที่ 10: การตรวจคำผิดและการค้นหา/แทนที่คำ" },
      { id: 11, title: "บทที่ 11: การใช้งาน Style และการสร้างสารบัญอัตโนมัติ" },
      { id: 12, title: "บทที่ 12: การส่งออกไฟล์และการพิมพ์เอกสาร (Print & Export)" }
    ];

    const inputName = document.getElementById("player-input");
    const savedName = localStorage.getItem("word_road_player_name");
    if (savedName) inputName.value = savedName;

    function handleLogin() {
      const name = inputName.value.trim();
      if (!name) { alert("กรุณาพิมพ์ชื่อ - นามสกุล หรือ เลขที่ก่อนนะครับ!"); return; }

      localStorage.setItem("word_road_player_name", name);
      document.getElementById("display-user-name").innerText = name;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("hub-screen").style.display = "flex";
      renderHubUnits();
    }

    function switchUser() {
      document.getElementById("hub-screen").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }

    function renderHubUnits() {
      const container = document.getElementById("units-grid");
      container.innerHTML = "";
      unitsList.forEach(u => {
        const card = document.createElement("div");
        card.className = "unit-card";
        card.innerHTML = `
          <div>
            <span class="unit-tag">UNIT ${u.id}</span>
            <div class="unit-title-text">${u.title}</div>
          </div>
          <div class="btn-group">
            <button class="btn-act btn-read" onclick="goToStudy(${u.id})">📖 อ่านสรุป</button>
            <button class="btn-act btn-play" onclick="goToGame(${u.id})">🏎️ สนามแข่ง</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // กดแล้วเปลี่ยนหน้าไปยัง study.html?unit=X
    function goToStudy(unitId) {
      window.location.href = `study.html?unit=${unitId}`;
    }

    // กดแล้วเปลี่ยนหน้าไปยัง game.html?unit=X
    function goToGame(unitId) {
      window.location.href = `game.html?unit=${unitId}`;
    }
  </script>
</body>
</html>
